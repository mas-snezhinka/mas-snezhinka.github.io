<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МАС Снежинка</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;          /* убираем скроллбары */
  }

  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background-image: url("https://mas-snezhinka.github.io/img/massnegVR.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #0b0d12;

    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* лёгкое затемнение для читаемости текста */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at center,
      rgba(0, 0, 0, 0.15) 0%,
      rgba(0, 0, 0, 0.45) 100%
    );
    pointer-events: none;
  }

  .hero__title {
    position: relative;
    z-index: 1;

    color: #ffffff;
    font-size: clamp(1.8rem, 7vw, 5rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.15;

    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65),
                 0 0 48px rgba(0, 0, 0, 0.4);

    padding: 0 1.2rem;
    user-select: none;
  }
</style>
</head>
<body>
  <section class="hero">
    <h1 class="hero__title">+ Научный Бэкенд</h1>
  </section>
</body>
</html>
