<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Научный Бэкенд</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;          /* убираем скроллбары */
  }

  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background-image: url("https://mas-snezhinka.github.io/img/massnegVR.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #0b0d12;

    display: flex;
    align-items: flex-start;   /* прижимаем к верху */
    justify-content: flex-end; /* прижимаем к правому краю */
    padding: clamp(0.8rem, 2.5vw, 2rem);
  }

  /* лёгкое затемнение для читаемости текста */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
 /* background: radial-gradient(
      ellipse at center,
      rgba(0, 0, 0, 0.10) 0%,
      rgba(0, 0, 0, 0.40) 100%
    ); */
    pointer-events: none;
  }

  .hero__title {
    position: relative;
    z-index: 1;

    background-color: #2cb5f5;       /* подложка */
    color: #ffffff;
    font-size: clamp(1.1rem, 3.2vw, 2.2rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.15;

    padding: 0.55em 1.1em;
    border-radius: 10px;

    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);

    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    user-select: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <section class="hero">
    <h1 class="hero__title">+ Научный Бэкенд</h1>
  </section>
</body>
</html>
